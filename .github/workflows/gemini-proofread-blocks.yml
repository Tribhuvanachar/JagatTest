name: Gemini — proofread staged OCR blocks (budget capped)

# Proofreads the segmented OCR blocks in the PRIVATE repo's
# data/ocr_staging/, and pushes the result back there.
#
# WHY THIS RUNS HERE, same reason as gemini-resolve-conflicts.yml: Actions
# is free and unlimited on a public repository and capped at 2,000 minutes
# a month on a private one, and GEMINI_API_KEY is a secret HERE and not on
# ShriBuddhi -- a run there on 22 Sep 2026 reported it empty. Nothing
# sensitive is committed here: the text arrives from the private repo and
# leaves for it.
#
# WHY A SEPARATE WORKFLOW from gemini-resolve-conflicts.yml: that one
# adjudicates pages where Sarvam and Vision DISAGREE. This one proofreads
# blocks where there is only one reading -- the Aitareya volumes are Sarvam
# only, segmented by tools/aitareya/segment.py into addressed blocks. There
# is nothing to adjudicate; there is OCR to correct.
#
# COSTS MONEY, but little: Gemini is Rs0.0517/page on this corpus, and all
# three Aitareya volumes together are about Rs85. The run is resumable --
# a block already carrying text_proofread is skipped -- so an interrupted
# run costs nothing to resume and a rerun over a finished file spends zero.

on:
  workflow_dispatch:
    inputs:
      volumes:
        description: "Comma-separated staged volumes under data/ocr_staging/aitareya/"
        required: true
        default: "bhagavantaraya,ratnamala,visvesvara_tirtha"
      budget:
        description: "Hard cap in rupees. The run stops cleanly when reached; rerun to continue."
        required: true
        default: "150"
      model:
        description: "Gemini model (blank = the client's default)"
        required: false
        default: ""
      mode:
        description: "plan counts blocks and spends nothing. real-run calls Gemini."
        type: choice
        options: [plan, real-run]
        default: plan
      workers:
        description: "Parallel Gemini calls. 6 did 825 blocks in 239 min and still hit the 240-minute job ceiling."
        required: false
        default: "10"

concurrency:
  # Two runs over the same staged file would both read it, both write it,
  # and the second would silently drop the first's paid work.
  group: gemini-proofread-${{ inputs.volumes }}
  cancel-in-progress: false

jobs:
  proofread:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: tools }

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Check the private repo is reachable before spending anything
        if: ${{ inputs.mode == 'real-run' }}
        env:
          T: ${{ secrets.SHRIBUDDHI_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$T" || { echo "::error::SHRIBUDDHI_TOKEN is not set."; exit 1; }
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $T" \
            https://api.github.com/repos/Tribhuvanachar/ShriBuddhi)
          [ "$CODE" = "200" ] || { echo "::error::SHRIBUDDHI_TOKEN cannot read ShriBuddhi (HTTP $CODE)"; exit 1; }
          test -n "${{ secrets.GEMINI_API_KEY }}" || { echo "::error::GEMINI_API_KEY is not set."; exit 1; }

          # READ IS NOT ENOUGH, and this step used to stop here. On 22 Sep
          # 2026 run 35687670866 passed this check, cloned fine, proofread 825
          # blocks with real money, and only then discovered the token cannot
          # push: "remote: Invalid username or token". The result survived
          # only because the artifact step runs before the push step and it
          # had to be merged back by hand
          # (ShriBuddhi tools/aitareya/land_proofread.py).
          #
          # So prove the WRITE before spending anything. A --dry-run push
          # authenticates and asks the server for permission without
          # transferring or changing a single object.
          PUSHDIR="$RUNNER_TEMP/pushcheck"
          git init -q "$PUSHDIR"
          if ! git -C "$PUSHDIR" push --dry-run \
                 "https://x-access-token:$T@github.com/Tribhuvanachar/ShriBuddhi.git" \
                 HEAD:refs/heads/__push_permission_probe 2>"$RUNNER_TEMP/push.err"; then
            if grep -qiE 'permission|denied|not authorized|invalid username or token|403' "$RUNNER_TEMP/push.err"; then
              sed 's/^/  /' "$RUNNER_TEMP/push.err"
              echo "::error::SHRIBUDDHI_TOKEN can READ ShriBuddhi but cannot PUSH to it, so this run would spend money and then be unable to save the result. Fix it at GitHub -> Settings -> Developer settings -> Fine-grained tokens -> the token behind SHRIBUDDHI_TOKEN -> Repository permissions -> Contents: Read and write, then update the secret on this repo. (ShriBuddhi is public now, so the alternative is to set GEMINI_API_KEY there and run this workflow in the same checkout as the data, with no token and no push step at all.)"
              exit 1
            fi
            # An unborn HEAD or a server that declines the probe ref for some
            # other reason is not evidence of a permission problem; say so and
            # carry on rather than blocking a run that would have worked.
            sed 's/^/  /' "$RUNNER_TEMP/push.err"
            echo "::warning::Could not conclusively verify push permission; continuing. If the push at the end fails, the result is still in the gemini-proofread artifact."
          fi
          rm -rf "$PUSHDIR"
          echo "private repo readable AND writable, Gemini key present"

      - name: Proofread
        env:
          GEMINI_API_KEY: ${{ inputs.mode == 'dry-run' && '' || secrets.GEMINI_API_KEY }}
          T: ${{ secrets.SHRIBUDDHI_TOKEN }}
        run: |
          set -euo pipefail
          WORK_DIR="$RUNNER_TEMP/priv"
          # A PARTIAL clone, not a shallow one -- see the long note in
          # gemini-resolve-conflicts.yml. --depth rewrites .git/shallow on
          # every fetch and races anything else pushing to ShriBuddhi.
          git clone -q --filter=blob:none --no-checkout \
            "https://x-access-token:$T@github.com/Tribhuvanachar/ShriBuddhi.git" "$WORK_DIR"
          ( cd "$WORK_DIR"
            for a in 1 2 3; do
              git fetch -q --no-tags origin main && break
              echo "fetch of main failed (attempt $a), retrying"; sleep $((a*5))
            done
            # The staged blocks live on main, committed by segment.py --write.
            git checkout -q FETCH_HEAD -- "data/ocr_staging/aitareya" )

          EXTRA=""
          [ "${{ inputs.mode }}" = "real-run" ] && EXTRA="--real"
          [ -n "${{ inputs.model }}" ] && EXTRA="$EXTRA --model ${{ inputs.model }}"
          python3 tools/aitareya/proofread.py \
            --staged-dir "$WORK_DIR/data/ocr_staging/aitareya" \
            --volumes "${{ inputs.volumes }}" \
            --budget "${{ inputs.budget }}" \
            --concurrency "${{ inputs.workers || '10' }}" \
            $EXTRA | tee "$RUNNER_TEMP/run.log"
          {
            echo "## Gemini proofread"
            echo '```'
            cat "$RUNNER_TEMP/run.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the result as an artifact
        if: ${{ always() && inputs.mode == 'real-run' }}
        uses: actions/upload-artifact@v4
        with:
          name: gemini-proofread
          path: ${{ runner.temp }}/priv/data/ocr_staging/aitareya/*_segmented.json
          if-no-files-found: ignore

      - name: Push the proofread blocks back to the private repo
        # always(), not success(). Blocks already proofread were BILLED, and a
        # later call timing out is no reason to throw them away -- exactly what
        # cost Rs6.19 of finished work on 19 Sep. proofread.py writes every 25
        # blocks for the same reason.
        if: ${{ always() && inputs.mode == 'real-run' }}
        env:
          T: ${{ secrets.SHRIBUDDHI_TOKEN }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/priv"
          git config user.name  "jagattest-bot"
          git config user.email "noreply@anthropic.com"
          git add data/ocr_staging/aitareya || true
          if git diff --cached --quiet; then
            echo "nothing changed -- every block was already proofread"
            exit 0
          fi
          git commit -q -m "Gemini proofread: ${{ inputs.volumes }}

          Ran tools/aitareya/proofread.py from the public repo, where
          GEMINI_API_KEY lives, under a Rs${{ inputs.budget }} cap. Blocks
          already carrying text_proofread were skipped, so this is resumable
          and a rerun over a finished file spends nothing."
          # The loop used to end with an unconditional "pushed the proofread
          # blocks back" -- so three failed attempts printed success and the
          # step exited 0. A run that spends money and loses it must not read
          # as a clean run.
          PUSHED=no
          for a in 1 2 3; do
            if git push -q "https://x-access-token:$T@github.com/Tribhuvanachar/ShriBuddhi.git" HEAD:main; then
              PUSHED=yes; break
            fi
            echo "push failed (attempt $a); rebasing and retrying"
            git fetch -q --no-tags origin main && git rebase -q FETCH_HEAD || true
            sleep $((a*5))
          done
          if [ "$PUSHED" != "yes" ]; then
            echo "::error::The proofread blocks were PAID FOR but could not be pushed to ShriBuddhi. They are not lost: download this run's \`gemini-proofread\` artifact and land it with ShriBuddhi's tools/aitareya/land_proofread.py --from <unzipped dir> --write. Then fix the token (see the preflight step's message) so the next run does not need rescuing."
            {
              echo "### PUSH FAILED — the result is in the \`gemini-proofread\` artifact"
              echo ""
              echo "Recover it with ShriBuddhi's \`tools/aitareya/land_proofread.py --from <unzipped dir> --write\`."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "pushed the proofread blocks back to ShriBuddhi"
